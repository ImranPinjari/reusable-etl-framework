dataset: customers

required_columns:
  - customer_id
  - name
  - email
  - city
  - registration_date

primary_key: customer_id

rules:
  customer_id:
    type: integer
    nullable: false
  name:
    type: string
    nullable: false
  email:
    type: email
    nullable: false
  city:
    type: string
    nullable: false
  registration_date:
    type: date
    nullable: false
